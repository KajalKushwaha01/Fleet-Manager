global:
  resolve_timeout: 5m

route:
  group_by:
    - alertname
    - severity
    - category
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: warning-webhook
  routes:
    - matchers:
        - severity="critical"
      receiver: critical-webhook
      repeat_interval: 1h
    - matchers:
        - severity="warning"
      receiver: warning-webhook
      repeat_interval: 4h
    - matchers:
        - severity="none"
      receiver: watchdog-null
      repeat_interval: 24h

receivers:
  - name: critical-webhook
    webhook_configs:
      - url: "http://fleet-manager:8080/api/alerts/webhook"
        send_resolved: true

  - name: warning-webhook
    webhook_configs:
      - url: "http://fleet-manager:8080/api/alerts/webhook"
        send_resolved: true

  - name: watchdog-null

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - instance
