global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: fleet-manager
    metrics_path: /metrics
    static_configs:
      - targets:
          - fleet-manager:8080

  - job_name: linux-nodes
    http_sd_configs:
      - url: http://fleet-manager:8080/api/sd/targets
        refresh_interval: 15s
